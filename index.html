  <body class="d-flex">

    <button id="sidebarToggle" class="sidebar-toggle" aria-label="Open navigation menu" aria-controls="appSidebar" aria-expanded="false">

      <div class="user-info">

        <i id="logoutBtn" class="bi bi-box-arrow-right logout-btn" role="button"

      </div>

      <nav class="sidebar-nav">

        <div class="nav-item active-content" data-page="Dashboard">
          <i class="bi bi-speedometer2"></i><span>Dashboard</span>

        <div class="nav-item" data-page="Products">

    <main class="flex-grow-1">

    <script type="module">
    //* Every browser starts on the Neon database; a saved URL can still override it
    import { getSavedApiUrl, saveApiUrl } from "./js/config.js";

    window.__PONTYPOOL_CONFIG__ = window.__PONTYPOOL_CONFIG__ || {};
    window.__PONTYPOOL_CONFIG__.apiUrl = saveApiUrl(getSavedApiUrl());
  </script>
  <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/main.js?v=20260926-1" type="module"></script>
    <script>
      // Mobile drawer + global click ripple. Pure UI, no data changes.
      (function () {
        function closeSidebar() {
          document.body.classList.remove("sidebar-open");
          var t = document.getElementById("sidebarToggle");
          if (t) {
            t.setAttribute("aria-expanded", "false");
            t.setAttribute("aria-label", "Open navigation menu");
            var icon = t.querySelector("i");
            if (icon) icon.className = "bi bi-list";
          }
        }
        function setToggleIcon(open) {
          var t = document.getElementById("sidebarToggle");
          if (!t) return;
          var icon = t.querySelector("i");
          if (icon) icon.className = open ? "bi bi-x-lg" : "bi bi-list";
        }
        function toggleSidebar() {
          var open = !document.body.classList.contains("sidebar-open");
          document.body.classList.toggle("sidebar-open", open);
          if (open) document.body.classList.add("drawer-used");
          var t = document.getElementById("sidebarToggle");
          if (t) {
            t.setAttribute("aria-expanded", open ? "true" : "false");
            t.setAttribute("aria-label", open ? "Close navigation menu" : "Open navigation menu");
          }
          setToggleIcon(open);
        }
        function bindSidebar() {
          var toggle = document.getElementById("sidebarToggle");
          var backdrop = document.getElementById("sidebarBackdrop");
          if (toggle && !toggle.dataset.bound) {
            toggle.dataset.bound = "1";
            toggle.addEventListener("click", function (e) {
              e.stopPropagation();
              toggleSidebar();
            });
          }
          if (backdrop && !backdrop.dataset.bound) {
            backdrop.dataset.bound = "1";
            backdrop.addEventListener("click", closeSidebar);
          }
        }
        bindSidebar();
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", bindSidebar);
        }
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") closeSidebar();
        });
        document.addEventListener("click", function (e) {
          if (e.target.closest && e.target.closest(".nav-item") && window.innerWidth <= 992) closeSidebar();
        });
        // Swipe right from left edge opens, swipe left closes.
        var touchStartX = null;
        document.addEventListener("touchstart", function (e) {
          if (e.touches.length === 1) touchStartX = e.touches[0].clientX;
        }, { passive: true });
        document.addEventListener("touchend", function (e) {
          if (touchStartX === null) return;
          var startX = touchStartX;
          var endX = e.changedTouches[0].clientX;
          touchStartX = null;
          if (window.innerWidth > 992) return;
          if (endX - startX > 70 && startX < 60) toggleSidebarOpen(true);
          else if (startX - endX > 70) toggleSidebarOpen(false);
        }, { passive: true });
        function toggleSidebarOpen(open) {
          document.body.classList.toggle("sidebar-open", open);
          if (open) document.body.classList.add("drawer-used");
          var t = document.getElementById("sidebarToggle");
          if (t) {
            t.setAttribute("aria-expanded", open ? "true" : "false");
            var icon = t.querySelector("i");
            if (icon) icon.className = open ? "bi bi-x-lg" : "bi bi-list";
          }
        }
        // Material-style click ripple for buttons and nav items.
        document.addEventListener("pointerdown", function (e) {
          var el = e.target.closest ? e.target.closest(".btn, .nav-item, .action-btn, .page-link") : null;
          if (!el) return;
          // Nav rows get a still, instant highlight swap instead. A scaling
          // ripple inside a narrow clipped row reads as a shake on click, so
          // it is never created for them.
          if (el.classList.contains("nav-item")) return;
          var rect = el.getBoundingClientRect();
          var size = Math.max(rect.width, rect.height);
          var dot = document.createElement("span");
          dot.className = "ink-ripple";
          dot.style.width = dot.style.height = size + "px";
          dot.style.left = (e.clientX - rect.left - size / 2) + "px";
          dot.style.top = (e.clientY - rect.top - size / 2) + "px";
          if (getComputedStyle(el).position === "static") el.style.position = "relative";
          el.appendChild(dot);
          setTimeout(function () { dot.remove(); }, 600);
        });
      })();
    </script>
  </body>

</html>
