# Publishes the static frontend to GitHub Pages so the app can be opened from anywhere.
# The database stays on Neon, so every device reads and writes the same data.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on the first run if it is not enabled yet.
          enablement: true

      - name: Stage the frontend
        run: |
          mkdir _site
          cp -R index.html login.html css js pontylogo.jpeg robots.txt sitemap.xml _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
