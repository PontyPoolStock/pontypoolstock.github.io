<!doctype html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sign In | Pontypool Stock Management System</title>
        <meta name="description"
            content="Sign in to the Pontypool stock management system to manage products, categories, stock levels, and activity reports." />
        <meta name="robots" content="index, follow" />
        <link rel="canonical"
            href="https://pontypoolstock.github.io/login.html" />
        <link rel="icon" type="image/svg+xml"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23facc15'/%3E%3Cpath d='M16 22l16-8 16 8-16 8-16-8zm0 8l16 8 16-8v12L32 50 16 42V30z' fill='black'/%3E%3C/svg%3E" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
        <link rel="stylesheet" href="./css/style.css?v=20260925-9" />
    </head>

    <body class="login-page">
        <div class="login-background-glow">
            <span class="glow-orb glow-orb-1"></span>
            <span class="glow-orb glow-orb-2"></span>
            <span class="glow-orb glow-orb-3"></span>
        </div>

        <div class="login-card">
            <div class="login-logo">
                <div class="login-badge-pill">
                    <i class="bi bi-shield-check"></i>
                    <span>Secure Portal</span>
                </div>
                <img class="login-logo-image" src="./pontylogo.jpeg"
                    alt="Pontypool Electricals and Lighting" />
                <p>Sign in to manage products, categories, and stock.</p>
            </div>

            <div id="loginError" class="alert alert-danger d-none"
                role="alert"></div>

            <form id="loginForm" class="d-grid gap-3" method="post" autocomplete="on">
                <div>
                    <label for="loginEmail" class="form-label">Email
                        address</label>
                    <div class="input-icon-group">
                        <i class="bi bi-envelope input-icon"></i>
                        <input
                            type="email"
                            id="loginEmail"
                            name="username"
                            class="form-control"
                            placeholder="admin@pontypool.com"
                            autocomplete="username"
                            autocapitalize="off"
                            autocorrect="off"
                            spellcheck="false"
                            required />
                    </div>
                </div>

                <div>
                    <div class="d-flex justify-content-between align-items-center">
                        <label for="loginPassword" class="form-label mb-1">Password</label>
                    </div>
                    <div class="input-icon-group password-group">
                        <i class="bi bi-lock input-icon"></i>
                        <input
                            type="password"
                            id="loginPassword"
                            name="current-password"
                            class="form-control"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            autocapitalize="off"
                            autocorrect="off"
                            spellcheck="false"
                            required />
                        <button type="button" class="btn-toggle-password" id="togglePasswordBtn" aria-label="Toggle password visibility" tabindex="-1">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <label class="login-remember">
                    <input type="checkbox" id="rememberMe" checked />
                    <span>Keep me signed in</span>
                </label>

                <button type="submit" id="loginSubmitBtn" class="btn btn-primary w-100 py-2">
                    <span class="btn-text">Sign In</span>
                    <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="./js/pages/login.js?v=20260925-2" type="module"></script>
    </body>

</html>
