name: Build Windows desktop app

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build signed Windows installer
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_CERTIFICATE_BASE64 -or -not $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD) {
            throw "Add the public code-signing certificate as the WINDOWS_SIGNING_CERTIFICATE_BASE64 and WINDOWS_SIGNING_CERTIFICATE_PASSWORD GitHub Actions secrets before releasing."
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "pontypool-codesign.pfx"
          try {
            $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
            [System.IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
            $env:CSC_LINK = $certificatePath
            $env:CSC_KEY_PASSWORD = $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD

            npm run build:win
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            $signature = Get-AuthenticodeSignature "release\PontyPoolStockManager-Setup.exe"
            if ($signature.Status -ne "Valid") {
              throw "The generated installer is not validly code-signed: $($signature.StatusMessage)"
            }
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "release/PontyPoolStockManager-Setup.exe" --title "PontyPool Stock Manager $env:GITHUB_REF_NAME" --notes "Windows installer for PontyPool Stock Manager." --latest
